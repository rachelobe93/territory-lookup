<style>
  :root{
    --ink:#1c2b24;
    --paper:#f6f3ec;
    --panel:#ffffff;
    --line:#dcd6c6;
    --moss:#3f6b52;
    --moss-dark:#2c4d3a;
    --clay:#b55a37;
    --muted:#7a7566;
    --amber:#c8912f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand .mark{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--moss);
    font-weight:700;
  }
  .brand h1{
    font-size:26px;
    margin:0;
    font-weight:400;
    letter-spacing:.01em;
  }
  .count-pill{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--muted);
    text-align:right;
    line-height:1.5;
  }
  .count-pill b{
    display:block;
    font-size:16px;
    color:var(--ink);
    font-family:'Iowan Old Style',Georgia,serif;
  }

  .search-panel{
    position:relative;
  }
  .search-row{
    display:flex;
    gap:0;
    border:2px solid var(--ink);
    background:var(--panel);
  }
  .search-row input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    padding:16px 14px;
    font-size:22px;
    letter-spacing:.04em;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:600;
    color:var(--ink);
  }
  .search-row input::placeholder{
    color:#b7b0a0;
    font-weight:400;
  }
  .search-row button{
    border:none;
    background:var(--moss);
    color:#fff;
    padding:0 22px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:700;
    cursor:pointer;
  }

    font-size:12px;
    color:var(--muted);
    margin-top:9px;
    letter-spacing:.02em;
  }

  .suggestions{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:var(--panel);
    border:2px solid var(--ink);
    border-top:none;
    z-index:10;
    max-height:240px;
    overflow-y:auto;
    display:none;
  }
  .suggestions.show{ display:block; }
  .suggestions div{
    padding:10px 14px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
  }
  .suggestions div:hover{ background:var(--paper); }
  .suggestions .s-zip{ font-weight:700; }
  .suggestions .s-city{ color:var(--muted); }

  #results{ margin-top:30px; }

  .result-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:6px;
  }
  .result-head h2{
    font-size:28px;
    margin:0;
    font-weight:400;
  }
  .result-head .loc{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.02em;
  }

  .rep-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:5px solid var(--moss);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .rep-card.open{ border-left-color:var(--clay); }
  .rep-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .rep-card .division{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:4px;
  }
  .rep-name{
    font-size:19px;
    line-height:1.2;
  }
  .rep-name.open-flag{
    color:var(--clay);
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14px;
    letter-spacing:.03em;
    text-transform:uppercase;
    font-weight:700;
  }
  .rep-card .source{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:10.5px;
    color:#a39d8c;
    text-align:right;
    white-space:nowrap;
  }

  .reveal-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:8px;
    border:1px solid var(--moss);
    background:var(--paper);
    color:var(--moss);
    padding:7px 12px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    border-radius:20px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .reveal-btn:active{ background:var(--moss); color:#fff; }
  .reveal-btn .chev{
    width:11px;
    height:11px;
    transition:transform .15s ease;
    flex-shrink:0;
  }
  .reveal-btn.expanded{ background:var(--moss); color:#fff; }
  .reveal-btn.expanded .chev{ transform:rotate(90deg); }

  .contact-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .2s ease;
  }
  .contact-details{
    padding-top:12px;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .contact-line{
    font-size:13px;
    color:var(--muted);
    margin-bottom:8px;
  }
  .contact-line b{ color:var(--ink); }

  .contact-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .contact-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    text-decoration:none;
    padding:9px 6px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .12s, border-color .12s, color .12s;
  }
  .contact-btn svg{ width:14px; height:14px; flex-shrink:0; }
  .contact-btn.call{ }
  .contact-btn.call:hover{ background:var(--moss); border-color:var(--moss); color:#fff; }
  .contact-btn.text:hover{ background:var(--amber); border-color:var(--amber); color:#fff; }
  .contact-btn.email:hover{ background:var(--clay); border-color:var(--clay); color:#fff; }
  .contact-btn[disabled], .contact-btn.disabled{
    opacity:.35;
    cursor:not-allowed;
    pointer-events:none;
  }
  .no-contact{
    margin-top:10px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11.5px;
    color:#a39d8c;
    font-style:italic;
  }

  .empty, .prompt{
    margin-top:40px;
    text-align:center;
    color:var(--muted);
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .empty .big, .prompt .big{
    font-family:'Iowan Old Style',Georgia,serif;
    font-size:22px;
    color:var(--ink);
    margin-bottom:8px;
  }
  .prompt .sample{
    margin-top:22px;
    display:inline-flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .prompt .sample span{
    border:1px solid var(--line);
    background:var(--panel);
    padding:6px 12px;
    font-size:13px;
    cursor:pointer;
    letter-spacing:.03em;
  }
  .prompt .sample span:hover{ border-color:var(--moss); color:var(--moss); }

  footer{
    margin-top:50px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    color:#a39d8c;
    letter-spacing:.02em;
  }

  @media (max-width:480px){
    .brand h1{ font-size:21px; }
    .search-row input{ font-size:18px; padding:13px 10px; }
    .search-row button{ padding:0 14px; font-size:11px; }
    .result-head h2{ font-size:22px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>

<script>
(function(){
  const input = document.getElementById('zipInput');
  const btn = document.getElementById('searchBtn');
  const results = document.getElementById('results');
  const suggestions = document.getElementById('suggestions');
  const zipCountEl = document.getElementById('zipCount');
  const footerNote = document.getElementById('footerNote');

  // Build zip -> records index
  const byZip = {};
  ZIP_DATA.forEach(r => {
    if(!r.zip) return;
    if(!byZip[r.zip]) byZip[r.zip] = [];
    byZip[r.zip].push(r);
  });
  const allZips = Object.keys(byZip).sort();
  zipCountEl.textContent = allZips.length.toLocaleString();

  const sourceCount = new Set(ZIP_DATA.map(r => r.source)).size;
  footerNote.textContent = 'Built from ' + sourceCount + ' territory alignment exports · updated 8/17/2026';

  function divisionRank(d){
    const order = ['Facility Services','Uniform Rental','SRIT Uniform Rental','Fire Protection Specialist','First Aid & Safety'];
    const i = order.indexOf(d);
    return i === -1 ? 99 : i;
  }

  function renderPrompt(){
    results.innerHTML = `
      <div class="prompt">
        <div class="big">Type a zip code to see who owns it.</div>
        <div>Try one of these, or start typing above.</div>
        <div class="sample">
          ${['63301','62201','62214','63013'].map(z => `<span data-z="${z}">${z}</span>`).join('')}
        </div>
      </div>`;
    results.querySelectorAll('.sample span').forEach(s => {
      s.addEventListener('click', () => { input.value = s.dataset.z; doSearch(); });
    });
  }

  function renderEmpty(zip){
    results.innerHTML = `
      <div class="empty">
        <div class="big">No assignment found for ${zip}.</div>
        <div>This zip code doesn't appear in any of the loaded territory files. Double-check the digits, or it may not be in a covered service area.</div>
      </div>`;
  }

  function renderResults(zip){
    const recs = (byZip[zip] || []).slice().sort((a,b) => divisionRank(a.division) - divisionRank(b.division));
    if(recs.length === 0){ renderEmpty(zip); return; }
    const first = recs[0];
    const phoneIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;
    const textIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
    const emailIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" fill="none"/><path d="M22 6 12 13 2 6"/><path d="M2 6h20v12H2z"/></svg>`;

    const cards = recs.map((r, i) => {
      const isOpen = /^open/i.test((r.rep||'').trim());
      const phone = r.phone ? r.phone.trim() : null;
      const email = r.email ? r.email.trim() : null;
      const telHref = phone ? 'tel:' + phone.replace(/[^0-9+]/g,'') : null;
      const smsHref = phone ? 'sms:' + phone.replace(/[^0-9+]/g,'') : null;
      const mailHref = email ? 'mailto:' + email : null;
      const cardId = 'rep-' + zip + '-' + i;

      const panelInner = (phone || email) ? `
        <div class="contact-details">
          ${phone ? `<div class="contact-line"><b>Phone:</b> ${phone}</div>` : ''}
          ${email ? `<div class="contact-line"><b>Email:</b> ${email}</div>` : ''}
          <div class="contact-row">
            <a class="contact-btn call ${telHref ? '' : 'disabled'}" href="${telHref || '#'}" target="_top" rel="noopener">${phoneIcon} Call</a>
            <a class="contact-btn text ${smsHref ? '' : 'disabled'}" href="${smsHref || '#'}" target="_top" rel="noopener">${textIcon} Text</a>
            <a class="contact-btn email ${mailHref ? '' : 'disabled'}" href="${mailHref || '#'}" target="_top" rel="noopener">${emailIcon} Email</a>
          </div>
        </div>` : `<div class="contact-details"><div class="no-contact">No contact info on file for this rep.</div></div>`;

      const nameHtml = isOpen
        ? `<span class="rep-name open-flag">${r.rep || '—'}</span>`
        : `<span class="rep-name">${r.rep || '—'}</span>
           <button type="button" class="reveal-btn" data-target="${cardId}">
             Contact
             <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
           </button>`;

      return `
        <div class="rep-card ${isOpen ? 'open' : ''}">
          <div class="rep-top">
            <div>
              <div class="division">${r.division}${r.location ? ' · ' + r.location : ''}</div>
              ${nameHtml}
            </div>
            <div class="source">${r.source}</div>
          </div>
          ${isOpen ? '' : `<div class="contact-panel" id="${cardId}">${panelInner}</div>`}
        </div>`;
    }).join('');

    results.innerHTML = `
      <div class="result-head">
        <h2>${zip} — ${titleCase(first.city)}, ${first.state}</h2>
        <div class="loc">${recs.length} assignment${recs.length === 1 ? '' : 's'} on file</div>
      </div>
      ${cards}`;

    results.querySelectorAll('.reveal-btn[data-target]').forEach(btnEl => {
      btnEl.addEventListener('click', () => {
        const panel = document.getElementById(btnEl.dataset.target);
        const isOpenNow = btnEl.classList.contains('expanded');
        // close any other open panels
        results.querySelectorAll('.contact-panel').forEach(p => { p.style.maxHeight = '0px'; });
        results.querySelectorAll('.reveal-btn.expanded').forEach(b => b.classList.remove('expanded'));
        if(!isOpenNow){
          panel.style.maxHeight = panel.scrollHeight + 'px';
          btnEl.classList.add('expanded');
        }
      });
    });
  }

  function titleCase(s){
    if(!s) return '';
    return s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  }

  function doSearch(){
    const zip = input.value.trim();
    suggestions.classList.remove('show');
    if(zip.length === 0){ renderPrompt(); return; }
    renderResults(zip.padStart(5,'0'));
  }

  function updateSuggestions(){
    const val = input.value.trim();
    if(val.length === 0){ suggestions.classList.remove('show'); return; }
    const matches = allZips.filter(z => z.startsWith(val)).slice(0, 8);
    if(matches.length === 0 || (matches.length === 1 && matches[0] === val)){
      suggestions.classList.remove('show');
      return;
    }
    suggestions.innerHTML = matches.map(z => {
      const city = byZip[z][0].city, state = byZip[z][0].state;
      return `<div data-z="${z}"><span class="s-zip">${z}</span><span class="s-city">${titleCase(city)}, ${state}</span></div>`;
    }).join('');
    suggestions.classList.add('show');
    suggestions.querySelectorAll('div').forEach(d => {
      d.addEventListener('click', () => {
        input.value = d.dataset.z;
        doSearch();
      });
    });
  }

  input.addEventListener('input', () => {
    input.value = input.value.replace(/[^0-9]/g,'');
    updateSuggestions();
  });
  input.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
  btn.addEventListener('click', doSearch);
  document.addEventListener('click', e => {
    if(!e.target.closest('.search-panel')) suggestions.classList.remove('show');
  });

  renderPrompt();
})();
</script>
